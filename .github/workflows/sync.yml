name: Sync to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee mirror
        run: |
          git remote add gitee "https://hcd05:${{ secrets.GITEE_TOKEN }}@gitee.com/hcd05/hcd.git"
          git push -f gitee main
